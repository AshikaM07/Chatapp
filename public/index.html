<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>LiveChat</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0a0a0f;--s1:#111118;--s2:#18181f;--s3:#22222c;
  --bd:rgba(255,255,255,0.07);--bd2:rgba(255,255,255,0.13);
  --tx:#e2e2ec;--mu:#666672;--ac:#7fff6e;--ac2:#6ebaff;
  --glow:rgba(127,255,110,0.18);
  --f:'Outfit',sans-serif;--mono:'JetBrains Mono',monospace;
}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--tx);font-family:var(--f);font-size:14px}
::-webkit-scrollbar{width:3px}::-webkit-scrollbar-thumb{background:var(--s3);border-radius:4px}

/* ─── AUTH ─────────────────────────────────────────── */
#auth{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--bg);z-index:99;padding:1rem}
.acard{width:100%;max-width:380px;background:var(--s1);border:1px solid var(--bd);border-radius:20px;padding:2rem;display:flex;flex-direction:column;gap:1.25rem}
.alogo{font-size:30px;font-weight:700;color:var(--ac);letter-spacing:-1px;display:flex;align-items:center;gap:10px}
.adot{width:10px;height:10px;border-radius:50%;background:var(--ac);animation:pulse 2s infinite}
.atabs{display:flex;gap:4px;background:var(--s2);border-radius:10px;padding:4px}
.atab{flex:1;padding:7px;border:none;border-radius:7px;background:transparent;color:var(--mu);font-family:var(--f);font-size:13px;font-weight:500;cursor:pointer;transition:all .2s}
.atab.on{background:var(--s3);color:var(--tx)}
.afield{display:flex;flex-direction:column;gap:5px}
.afield label{font-size:11px;color:var(--mu);text-transform:uppercase;letter-spacing:.08em}
.afield input{background:var(--s2);border:1px solid var(--bd);border-radius:10px;color:var(--tx);font-family:var(--f);font-size:14px;padding:.65rem 1rem;outline:none;width:100%;transition:border-color .2s}
.afield input:focus{border-color:var(--ac);box-shadow:0 0 0 3px var(--glow)}
.abtn{background:var(--ac);border:none;border-radius:10px;color:#0a0a0f;cursor:pointer;font-family:var(--f);font-size:15px;font-weight:600;padding:.75rem;transition:opacity .15s}
.abtn:hover{opacity:.88}.abtn:active{transform:scale(.98)}
.aerr{font-size:13px;color:#ff6e6e;text-align:center;min-height:18px}

/* ─── APP WRAPPER ──────────────────────────────────── */
#app{display:none;height:100vh;width:100vw;overflow:hidden}
#app.on{display:flex;flex-direction:row}

/* ─── RAIL ─────────────────────────────────────────── */
#rail{width:56px;min-width:56px;background:var(--s1);border-right:1px solid var(--bd);display:flex;flex-direction:column;align-items:center;padding:12px 0;gap:6px;flex-shrink:0}
.rlogo{font-size:18px;font-weight:700;color:var(--ac);margin-bottom:8px}
.rbtn{width:36px;height:36px;border-radius:10px;border:none;background:transparent;color:var(--mu);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:18px;transition:background .15s,color .15s;position:relative;flex-shrink:0}
.rbtn:hover,.rbtn.on{background:var(--s3);color:var(--tx)}
.rbtn.on::before{content:'';position:absolute;left:-6px;width:3px;height:55%;border-radius:2px;background:var(--ac)}
.rspace{flex:1}
.ravatar{width:32px;height:32px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;cursor:pointer;border:2px solid transparent;transition:border-color .2s;flex-shrink:0}
.ravatar:hover{border-color:var(--bd2)}

/* ─── SIDEBAR ──────────────────────────────────────── */
#sidebar{width:220px;min-width:220px;background:var(--s1);border-right:1px solid var(--bd);display:flex;flex-direction:column;overflow:hidden;flex-shrink:0;transition:transform .25s ease}
.shead{padding:.875rem 1rem .75rem;border-bottom:1px solid var(--bd);font-size:13px;font-weight:600;color:var(--tx);display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.sadd{width:22px;height:22px;border-radius:6px;border:none;background:var(--s3);color:var(--mu);cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center}
.sadd:hover{color:var(--tx)}
#slist{flex:1;overflow-y:auto;padding:6px}
.sitem{display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:8px;cursor:pointer;color:var(--mu);font-size:13px;transition:all .15s;user-select:none}
.sitem:hover{background:var(--s2);color:var(--tx)}
.sitem.on{background:var(--s3);color:var(--tx)}
.spfx{font-size:12px;opacity:.6}
.sbadge{margin-left:auto;background:var(--ac);color:#0a0a0f;font-size:10px;font-weight:700;border-radius:10px;padding:1px 6px;min-width:18px;text-align:center}

/* ─── CHAT PANE ────────────────────────────────────── */
#chat{flex:1;display:flex;flex-direction:column;overflow:hidden;background:var(--bg);min-width:0}
#topbar{padding:.875rem 1.25rem;border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:10px;background:var(--s1);flex-shrink:0}
.tbname{font-weight:600;font-size:15px}
.tbdesc{font-size:12px;color:var(--mu);margin-left:4px}
.tbonline{margin-left:auto;font-size:12px;color:var(--mu);display:flex;align-items:center;gap:5px;flex-shrink:0}
.odot{width:7px;height:7px;border-radius:50%;background:var(--ac)}
.hambtn{display:none;background:none;border:none;color:var(--mu);font-size:22px;cursor:pointer;padding:0 6px 0 0;line-height:1;flex-shrink:0}

#msgs{flex:1;overflow-y:auto;padding:1rem 1.25rem;display:flex;flex-direction:column;gap:2px;min-height:0}

/* ─── MESSAGES ─────────────────────────────────────── */
.mgrp{display:flex;gap:10px;padding:4px 0;animation:msgIn .2s ease}
.mavt{width:34px;height:34px;border-radius:10px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;cursor:pointer;margin-top:2px}
.mcnt{flex:1;min-width:0}
.mhdr{display:flex;align-items:baseline;gap:8px;margin-bottom:3px}
.mname{font-weight:600;font-size:13px;cursor:pointer}
.mname:hover{text-decoration:underline}
.mtime{font-size:11px;color:var(--mu)}
.mtxt{font-size:14px;line-height:1.6;word-break:break-word}
.mimg{max-width:min(300px,100%);max-height:220px;border-radius:10px;margin-top:6px;cursor:pointer;display:block}
.mfile{display:inline-flex;align-items:center;gap:8px;background:var(--s2);border:1px solid var(--bd);border-radius:8px;padding:8px 12px;margin-top:6px;font-size:13px;color:var(--ac2);text-decoration:none;max-width:100%;overflow:hidden}
.macts{display:none;gap:4px;align-items:center;margin-left:auto;flex-shrink:0}
.mgrp:hover .macts{display:flex}
.mactbtn{background:var(--s2);border:1px solid var(--bd);border-radius:6px;padding:3px 7px;cursor:pointer;font-size:13px}
.mactbtn:hover{background:var(--s3)}
.rrow{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}
.rchip{display:flex;align-items:center;gap:4px;background:var(--s2);border:1px solid var(--bd);border-radius:20px;padding:2px 8px;cursor:pointer;font-size:13px}
.rchip.mine{border-color:var(--ac);background:rgba(127,255,110,.08)}
.rcnt{font-size:12px;color:var(--mu)}
.sysmsg{text-align:center;font-size:12px;color:var(--mu);padding:6px 0;font-style:italic}

/* ─── EMOJI PICKER ─────────────────────────────────── */
.epicker{position:fixed;background:var(--s2);border:1px solid var(--bd2);border-radius:12px;padding:8px;display:flex;flex-wrap:wrap;gap:4px;z-index:200;width:200px;box-shadow:0 8px 24px rgba(0,0,0,.4)}
.eopt{width:32px;height:32px;border-radius:6px;border:none;background:transparent;cursor:pointer;font-size:18px;display:flex;align-items:center;justify-content:center}
.eopt:hover{background:var(--s3)}

/* ─── INPUT ────────────────────────────────────────── */
#typebar{padding:3px 1.25rem;font-size:12px;color:var(--mu);min-height:20px;font-style:italic;flex-shrink:0}
#inputarea{padding:.875rem 1.25rem;border-top:1px solid var(--bd);background:var(--s1);flex-shrink:0}
#ibox{background:var(--s2);border:1px solid var(--bd);border-radius:12px;display:flex;align-items:flex-end;gap:8px;padding:8px 12px;transition:border-color .2s}
#ibox:focus-within{border-color:var(--ac);box-shadow:0 0 0 3px var(--glow)}
#msginput{flex:1;background:transparent;border:none;color:var(--tx);font-family:var(--f);font-size:14px;outline:none;resize:none;max-height:100px;line-height:1.5;min-width:0}
.iacts{display:flex;align-items:center;gap:4px;flex-shrink:0}
.iibtn{background:none;border:none;color:var(--mu);cursor:pointer;font-size:18px;padding:4px;border-radius:6px;display:flex;align-items:center}
.iibtn:hover{color:var(--tx)}
#sendbtn{background:var(--ac);border:none;border-radius:8px;color:#0a0a0f;cursor:pointer;font-family:var(--f);font-size:13px;font-weight:600;padding:6px 14px;white-space:nowrap}
#sendbtn:hover{opacity:.88}
#fileinput{display:none}
#uprev{display:none;align-items:center;gap:8px;padding:8px 12px;background:var(--s2);border:1px solid var(--bd);border-radius:10px;margin-bottom:8px;font-size:13px;color:var(--tx)}
#uprev img{max-height:48px;border-radius:6px}
.rmbtn{margin-left:auto;background:none;border:none;color:var(--mu);cursor:pointer;font-size:18px;padding:2px}

/* ─── BOTTOM NAV ────────────────────────────────────── */
#bnav{display:none;flex-shrink:0;background:var(--s1);border-top:1px solid var(--bd)}
.bnbtn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;background:none;border:none;color:var(--mu);cursor:pointer;font-size:11px;font-family:var(--f);padding:8px 4px;transition:color .15s}
.bnbtn .bi{font-size:20px;line-height:1}
.bnbtn.on{color:var(--ac)}
.bnbtn.red{color:#ff6e6e}

/* ─── BACKDROP ──────────────────────────────────────── */
#backdrop{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:18}
#backdrop.on{display:block}

/* ─── MODALS ────────────────────────────────────────── */
.movl{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:300;animation:fadeIn .2s ease;padding:1rem}
.modal{background:var(--s1);border:1px solid var(--bd);border-radius:16px;padding:1.5rem;width:100%;max-width:340px;display:flex;flex-direction:column;gap:1.25rem;position:relative}
.mavatar{width:56px;height:56px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:700}
.mmodname{font-size:20px;font-weight:600}
.mbio{font-size:13px;color:var(--mu)}
.mclose{position:absolute;top:1rem;right:1rem;background:var(--s2);border:none;border-radius:8px;color:var(--mu);cursor:pointer;width:28px;height:28px;font-size:16px;display:flex;align-items:center;justify-content:center}
.mclose:hover{color:var(--tx)}
.mbtns{display:flex;gap:8px}
.mbtn{flex:1;padding:8px;border-radius:8px;border:1px solid var(--bd);background:var(--s2);color:var(--tx);cursor:pointer;font-family:var(--f);font-size:13px;font-weight:500}
.mbtn:hover{background:var(--s3)}
.mbtn.pri{background:var(--ac);color:#0a0a0f;border-color:transparent}
.mfield{display:flex;flex-direction:column;gap:6px}
.mfield label{font-size:11px;color:var(--mu);text-transform:uppercase;letter-spacing:.08em}
.mfield input{background:var(--s2);border:1px solid var(--bd);border-radius:8px;color:var(--tx);font-family:var(--f);font-size:14px;padding:.6rem .875rem;outline:none;width:100%}
.mfield input:focus{border-color:var(--ac)}

/* ─── LIGHTBOX ──────────────────────────────────────── */
#lbox{display:none;position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:400;align-items:center;justify-content:center;cursor:zoom-out}
#lbox.on{display:flex}
#lbox img{max-width:90vw;max-height:90vh;border-radius:12px}

/* ─── DRAG OVERLAY ──────────────────────────────────── */
#dragov{display:none;position:fixed;inset:0;background:rgba(127,255,110,.05);border:2px dashed var(--ac);z-index:500;align-items:center;justify-content:center;font-size:20px;font-weight:600;color:var(--ac);pointer-events:none}
#dragov.on{display:flex}

/* ─── EMPTY ─────────────────────────────────────────── */
.empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--mu);gap:.5rem;font-size:13px}
.emptyico{font-size:40px}

/* ─── ANIMATIONS ────────────────────────────────────── */
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes msgIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
@keyframes pulse{0%,100%{box-shadow:0 0 6px var(--glow)}50%{box-shadow:0 0 14px var(--glow)}}

/* ═══════════════════════════════════════════
   TABLET  769px – 1024px
═══════════════════════════════════════════ */
@media(max-width:1024px) and (min-width:769px){
  #sidebar{width:190px;min-width:190px}
  .tbdesc{display:none}
}

/* ═══════════════════════════════════════════
   MOBILE  ≤768px
═══════════════════════════════════════════ */
@media(max-width:768px){
  /* Stack vertically */
  #app.on{flex-direction:column}

  /* Rail hidden */
  #rail{display:none}

  /* Sidebar becomes a slide-in drawer */
  #sidebar{
    position:fixed;top:0;left:0;bottom:0;
    width:78%;max-width:280px;z-index:20;
    transform:translateX(-100%);
    border-right:1px solid var(--bd2);
    box-shadow:4px 0 20px rgba(0,0,0,.5);
  }
  #sidebar.open{transform:translateX(0)}

  /* Chat fills remaining space */
  #chat{height:0;flex:1}

  /* Hamburger visible */
  .hambtn{display:flex}

  /* Topbar compact */
  #topbar{padding:.75rem 1rem}
  .tbdesc{display:none}

  /* Messages & input compact */
  #msgs{padding:.75rem 1rem}
  #typebar{padding:3px 1rem}
  #inputarea{padding:.75rem 1rem;padding-bottom:max(.75rem,env(safe-area-inset-bottom))}

  /* Images full width */
  .mimg{max-width:100%}

  /* Always show reaction btn (no hover on touch) */
  .macts{display:flex}

  /* Bottom nav */
  #bnav{display:flex;padding-bottom:env(safe-area-inset-bottom)}

  /* Emoji picker sticks to bottom */
  .epicker{bottom:80px;top:auto !important;left:8px !important;right:8px !important;width:auto !important}
}

/* ═══════════════════════════════════════════
   SMALL MOBILE  ≤400px
═══════════════════════════════════════════ */
@media(max-width:400px){
  .acard{border-radius:16px;padding:1.5rem}
  #sendbtn{padding:6px 10px;font-size:12px}
  .iibtn{font-size:16px}
}
</style>
</head>
<body>

<!-- AUTH -->
<div id="auth">
  <div class="acard">
    <div class="alogo"><span class="adot"></span>LiveChat</div>
    <div class="atabs">
      <button class="atab on" id="tlogin" onclick="swTab('login')">Sign in</button>
      <button class="atab" id="treg" onclick="swTab('register')">Register</button>
    </div>
    <div class="afield"><label>Username</label><input id="auser" type="text" placeholder="your_name" autocomplete="username"/></div>
    <div class="afield"><label>Password</label><input id="apass" type="password" placeholder="••••••••" autocomplete="current-password"/></div>
    <div class="aerr" id="aerr"></div>
    <button class="abtn" id="abtn" onclick="doAuth()">Sign in</button>
  </div>
</div>

<!-- APP -->
<div id="app">
  <div id="backdrop" onclick="closeSB()"></div>

  <!-- Rail (desktop) -->
  <div id="rail">
    <div class="rlogo">L</div>
    <button class="rbtn on" id="rrooms" title="Rooms" onclick="setPanel('rooms')">&#9783;</button>
    <button class="rbtn" id="rdms" title="DMs" onclick="setPanel('dms')">&#9993;</button>
    <div class="rspace"></div>
    <div class="ravatar" id="rme" onclick="showProfile(me?.username)" title="Profile"></div>
    <button class="rbtn" style="color:#ff6e6e" title="Logout" onclick="logout()">⏻</button>
  </div>

  <!-- Sidebar -->
  <div id="sidebar">
    <div class="shead">
      <span id="stitle">Rooms</span>
      <button class="sadd" id="sadd" onclick="openCreateRoom()" title="New room">+</button>
    </div>
    <div id="slist"></div>
  </div>

  <!-- Chat -->
  <div id="chat">
    <div id="topbar">
      <button class="hambtn" onclick="toggleSB()">☰</button>
      <div class="empty" style="flex:1;flex-direction:row;justify-content:flex-start;gap:8px">
        <span style="font-size:13px">Select a room or DM</span>
      </div>
    </div>
    <div id="msgs">
      <div class="empty"><div class="emptyico">💬</div><span>Pick a room from the sidebar</span></div>
    </div>
    <div id="typebar"></div>
    <div id="inputarea">
      <div id="uprev"></div>
      <div id="ibox">
        <textarea id="msginput" rows="1" placeholder="Message…"></textarea>
        <div class="iacts">
          <button class="iibtn" title="Attach" onclick="document.getElementById('fileinput').click()">📎</button>
          <button class="iibtn" title="Emoji" onclick="toggleEmoji()">😊</button>
          <button id="sendbtn" onclick="sendMsg()">Send</button>
        </div>
      </div>
      <input type="file" id="fileinput" accept="image/*,.pdf,.txt"/>
    </div>
  </div>

  <!-- Bottom nav (mobile) -->
  <div id="bnav">
    <button class="bnbtn on" id="bnrooms" onclick="mobilePanel('rooms')"><span class="bi">&#9783;</span>Rooms</button>
    <button class="bnbtn" id="bndms" onclick="mobilePanel('dms')"><span class="bi">&#9993;</span>DMs</button>
    <button class="bnbtn" onclick="showProfile(me?.username)"><span class="bi">&#9786;</span>Profile</button>
    <button class="bnbtn red" onclick="logout()"><span class="bi">⏻</span>Logout</button>
  </div>
</div>

<!-- Overlays -->
<div id="lbox" onclick="closeLB()"><img id="limg"/></div>
<div id="dragov">Drop file to send</div>
<div id="epick" style="display:none;position:fixed;z-index:250"></div>
<div id="mroot"></div>

<script src="/socket.io/socket.io.js"></script>
<script>
// ── STATE ──────────────────────────────────────────────
let token=localStorage.getItem('lc_tok');
let me=JSON.parse(localStorage.getItem('lc_me')||'null');
let sock=null,channel=null,rooms={},onlineUsers=[],pendingFile=null;
let typingUsers={},authMode='login',panelMode='rooms',dmList={};
const EMOJIS=['👍','❤️','😂','😮','😢','🔥','🎉','👀','💯','✅','😀','😎','🤔','😅','👏','🙏','💪','🎯','🚀','💡'];
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const ini=n=>n.slice(0,2).toUpperCase();
const isMob=()=>window.innerWidth<=768;
function aBg(u){const c=['#7fff6e','#6ebaff','#ff9f6e','#d46eff','#ff6eaa','#6effd4','#ffdc6e'];let h=0;for(const ch of u)h=(h*31+ch.charCodeAt(0))&0xffff;return c[h%c.length]}
function fmtT(iso){return new Date(iso).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}
function autoH(el){el.style.height='auto';el.style.height=Math.min(el.scrollHeight,100)+'px'}
function scrollB(){const m=$('msgs');m.scrollTop=m.scrollHeight}

// ── SIDEBAR ────────────────────────────────────────────
function toggleSB(){$('sidebar').classList.toggle('open');$('backdrop').classList.toggle('on')}
function closeSB(){$('sidebar').classList.remove('open');$('backdrop').classList.remove('on')}

// ── AUTH ───────────────────────────────────────────────
function swTab(m){
  authMode=m;
  $('tlogin').classList.toggle('on',m==='login');
  $('treg').classList.toggle('on',m==='register');
  $('abtn').textContent=m==='login'?'Sign in':'Create account';
  $('aerr').textContent='';
}
async function doAuth(){
  const u=$('auser').value.trim(),p=$('apass').value;
  if(!u||!p){$('aerr').textContent='Fill in all fields';return}
  try{
    const r=await fetch(authMode==='login'?'/api/login':'/api/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:u,password:p})});
    const d=await r.json();
    if(!r.ok){$('aerr').textContent=d.error;return}
    token=d.token;me=d.user;
    localStorage.setItem('lc_tok',token);localStorage.setItem('lc_me',JSON.stringify(me));
    boot();
  }catch{$('aerr').textContent='Network error'}
}
$('auser').addEventListener('keydown',e=>e.key==='Enter'&&$('apass').focus());
$('apass').addEventListener('keydown',e=>e.key==='Enter'&&doAuth());

// ── BOOT ───────────────────────────────────────────────
function boot(){
  $('auth').style.display='none';
  $('app').classList.add('on');
  const av=$('rme');av.textContent=ini(me.username);av.style.background=aBg(me.username);av.style.color='#0a0a0f';
  connectSock();
}

// ── SOCKET ─────────────────────────────────────────────
function connectSock(){
  sock=io({auth:{token}});
  sock.on('connect_error',e=>{if(e.message==='Unauthorized'){localStorage.clear();location.reload()}});
  sock.on('init',({rooms:rl,onlineUsers:ou})=>{rl.forEach(r=>rooms[r.id]=r);onlineUsers=ou;renderSB()});
  sock.on('rooms:update',rl=>{rooms={};rl.forEach(r=>rooms[r.id]=r);renderSB()});
  sock.on('users:online',u=>{onlineUsers=u;if(panelMode==='dms')renderDmSB()});
  sock.on('room:history',({roomId,messages})=>{if(channel?.id!==roomId)return;$('msgs').innerHTML='';messages.forEach(m=>addMsg(m,false));scrollB()});
  sock.on('message:room',({roomId,message})=>{if(channel?.id===roomId)addMsg(message)});
  sock.on('dm:history',({dmId,target,messages})=>{if(channel?.id!==dmId)return;$('msgs').innerHTML='';messages.forEach(m=>addMsg(m,false));scrollB();if(!dmList[dmId])dmList[dmId]={target,unread:0}});
  sock.on('message:dm',({dmId,message})=>{if(channel?.id===dmId)addMsg(message)});
  sock.on('dm:incoming',({dmId,from,message})=>{if(!dmList[dmId])dmList[dmId]={target:from,unread:0};if(channel?.id!==dmId){dmList[dmId].unread=(dmList[dmId].unread||0)+1;if(panelMode==='dms')renderDmSB()}else addMsg(message)});
  sock.on('reaction:update',({roomId,dmId,messageId,reactions})=>{const el=document.querySelector(`[data-mid="${messageId}"] .rrow`);if(el)renderRxns(el,{id:messageId,reactions},roomId,dmId)});
  sock.on('typing:update',({username,typing,roomId,dmId})=>{const k=roomId||dmId;if(typing){typingUsers[k]=typingUsers[k]||new Set();typingUsers[k].add(username)}else if(typingUsers[k])typingUsers[k].delete(username);updTyping(k)});
  sock.on('system',({roomId,text})=>{if(channel?.id===roomId)addSys(text)});
  sock.on('room:created',id=>openRoom(id));
}

// ── PANELS ─────────────────────────────────────────────
function setPanel(m){
  panelMode=m;
  $('rrooms').classList.toggle('on',m==='rooms');
  $('rdms').classList.toggle('on',m==='dms');
  $('sadd').style.display=m==='rooms'?'flex':'none';
  $('stitle').textContent=m==='rooms'?'Rooms':'Direct Messages';
  m==='rooms'?renderSB():renderDmSB();
}
function mobilePanel(m){
  document.querySelectorAll('.bnbtn').forEach(b=>b.classList.remove('on'));
  $('bn'+m).classList.add('on');
  setPanel(m);toggleSB();
}
function renderSB(){
  if(panelMode!=='rooms')return;
  const l=$('slist');l.innerHTML='';
  Object.values(rooms).forEach(r=>{
    const el=document.createElement('div');
    el.className='sitem'+(channel?.id===r.id?' on':'');
    el.innerHTML=`<span class="spfx">#</span><span>${esc(r.name)}</span>`;
    el.onclick=()=>{openRoom(r.id);if(isMob())closeSB()};
    l.appendChild(el);
  });
}
function renderDmSB(){
  const l=$('slist');l.innerHTML='';
  const oth=onlineUsers.filter(u=>u!==me.username);
  if(!oth.length){l.innerHTML='<div style="color:var(--mu);font-size:13px;padding:10px 8px">No other users online</div>';return}
  oth.forEach(u=>{
    const did=[me.username,u].sort().join('__');
    const unr=dmList[did]?.unread||0;const bg=aBg(u);
    const el=document.createElement('div');
    el.className='sitem'+(channel?.id===did?' on':'');
    el.innerHTML=`<span style="width:24px;height:24px;border-radius:6px;background:${bg};color:#0a0a0f;font-size:10px;font-weight:600;display:flex;align-items:center;justify-content:center;flex-shrink:0">${ini(u)}</span><span>${esc(u)}</span>${unr?`<span class="sbadge">${unr}</span>`:''}`;
    el.onclick=()=>{openDm(u);if(isMob())closeSB()};
    l.appendChild(el);
  });
}

// ── OPEN ROOM / DM ─────────────────────────────────────
function openRoom(id){
  const r=rooms[id];if(!r)return;
  channel={type:'room',id,name:r.name};
  sock.emit('room:join',id);updTop();renderSB();$('msginput').focus();
}
function openDm(u){
  const did=[me.username,u].sort().join('__');
  channel={type:'dm',id:did,name:u};
  if(dmList[did])dmList[did].unread=0;
  sock.emit('dm:open',u);updTop();renderDmSB();$('msginput').focus();
}
function updTop(){
  if(!channel)return;
  const ir=channel.type==='room';const r=ir?rooms[channel.id]:null;
  $('topbar').innerHTML=`
    <button class="hambtn" onclick="toggleSB()">☰</button>
    <span style="font-size:15px;color:var(--mu)">${ir?'#':'@'}</span>
    <span class="tbname">${esc(channel.name)}</span>
    ${r&&r.description?`<span class="tbdesc">${esc(r.description)}</span>`:''}
    <div class="tbonline"><span class="odot"></span><span>${onlineUsers.length} online</span></div>`;
}

// ── MESSAGES ───────────────────────────────────────────
function addMsg(msg,scroll=true){
  const bg=aBg(msg.username);
  const d=document.createElement('div');
  d.className='mgrp';d.dataset.mid=msg.id;
  let body='';
  if(msg.type==='image'&&msg.file)body=`<img class="mimg" src="${esc(msg.file.url)}" onclick="openLB('${esc(msg.file.url)}')"/>`;
  else if(msg.type==='file'&&msg.file)body=`<a class="mfile" href="${esc(msg.file.url)}" target="_blank" download>📄 ${esc(msg.file.name)}</a>`;
  if(msg.text)body=`<div class="mtxt">${esc(msg.text)}</div>`+body;
  d.innerHTML=`
    <div class="mavt" style="background:${bg};color:#0a0a0f" onclick="showProfile('${esc(msg.username)}')">${ini(msg.username)}</div>
    <div class="mcnt">
      <div class="mhdr">
        <span class="mname" style="color:${bg}" onclick="showProfile('${esc(msg.username)}')">${esc(msg.username)}</span>
        <span class="mtime">${fmtT(msg.timestamp)}</span>
        <div class="macts"><button class="mactbtn" onclick="openRxnPick(event,'${msg.id}')">+</button></div>
      </div>
      ${body}
      <div class="rrow"></div>
    </div>`;
  renderRxns(d.querySelector('.rrow'),msg,channel?.type==='room'?channel.id:null,channel?.type==='dm'?channel.id:null);
  $('msgs').appendChild(d);if(scroll)scrollB();
}
function addSys(t){const e=document.createElement('div');e.className='sysmsg';e.textContent=t;$('msgs').appendChild(e);scrollB()}
function renderRxns(el,msg,rid,did){
  el.innerHTML='';
  Object.entries(msg.reactions||{}).forEach(([em,us])=>{
    if(!us.length)return;
    const mine=us.includes(me.username);
    const c=document.createElement('div');c.className='rchip'+(mine?' mine':'');
    c.innerHTML=`${em}<span class="rcnt">${us.length}</span>`;c.title=us.join(', ');
    c.onclick=()=>sock.emit('reaction:toggle',{roomId:rid,dmId:did,messageId:msg.id,emoji:em});
    el.appendChild(c);
  });
}

// ── EMOJI PICKER ───────────────────────────────────────
let picMid=null,emojiOpen=false;
function openRxnPick(e,mid){
  e.stopPropagation();picMid=mid;
  const p=$('epick');p.innerHTML='';p.className='epicker';
  EMOJIS.slice(0,10).forEach(em=>{
    const b=document.createElement('button');b.className='eopt';b.textContent=em;
    b.onclick=()=>{sock.emit('reaction:toggle',{roomId:channel?.type==='room'?channel.id:null,dmId:channel?.type==='dm'?channel.id:null,messageId:picMid,emoji:em});p.style.display='none'};
    p.appendChild(b);
  });
  const r=e.target.getBoundingClientRect();
  if(!isMob()){p.style.left=r.left+'px';p.style.top=(r.bottom+4)+'px';p.style.bottom='';p.style.right=''}
  p.style.display='flex';
}
function toggleEmoji(){
  const p=$('epick');
  if(emojiOpen){p.style.display='none';emojiOpen=false;return}
  p.innerHTML='';p.className='epicker';
  EMOJIS.forEach(em=>{
    const b=document.createElement('button');b.className='eopt';b.textContent=em;
    b.onclick=()=>{$('msginput').value+=em;$('msginput').focus();p.style.display='none';emojiOpen=false};
    p.appendChild(b);
  });
  if(!isMob()){const r=$('sendbtn').getBoundingClientRect();p.style.left=(r.right-200)+'px';p.style.top=(r.top-230)+'px';p.style.bottom='';p.style.right=''}
  p.style.display='flex';emojiOpen=true;
}
document.addEventListener('click',e=>{if(!e.target.closest('#epick')&&!e.target.closest('.mactbtn')&&!e.target.closest('.iibtn')){$('epick').style.display='none';emojiOpen=false}});

// ── SEND ───────────────────────────────────────────────
async function sendMsg(){
  if(!channel)return;
  const txt=$('msginput').value.trim();
  if(!txt&&!pendingFile)return;
  let fp=null;
  if(pendingFile){
    try{const fd=new FormData();fd.append('file',pendingFile);const r=await fetch('/api/upload',{method:'POST',headers:{Authorization:`Bearer ${token}`},body:fd});fp=await r.json()}catch{}
    clearUp();
  }
  sock.emit(channel.type==='room'?'message:room':'message:dm',{[channel.type==='room'?'roomId':'dmId']:channel.id,text:txt,file:fp});
  $('msginput').value='';$('msginput').style.height='auto';
}
$('msginput').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMsg()}});
let typTm;
$('msginput').addEventListener('input',e=>{
  autoH(e.target);if(!channel)return;
  const p=channel.type==='room'?{roomId:channel.id}:{dmId:channel.id};
  sock.emit('typing:start',p);clearTimeout(typTm);
  typTm=setTimeout(()=>sock.emit('typing:stop',p),1500);
});
function updTyping(k){
  if(channel?.id!==k)return;
  const s=typingUsers[k];const a=s?[...s].filter(u=>u!==me.username):[];
  $('typebar').textContent=a.length===0?'':a.length===1?`${a[0]} is typing…`:`${a.slice(0,-1).join(', ')} and ${a.at(-1)} are typing…`;
}

// ── FILES ──────────────────────────────────────────────
$('fileinput').addEventListener('change',e=>{if(e.target.files[0])setFile(e.target.files[0])});
function setFile(f){
  pendingFile=f;const p=$('uprev');p.style.display='flex';
  const isImg=f.type.startsWith('image/');
  p.innerHTML=isImg?`<img src="${URL.createObjectURL(f)}"/><span>${esc(f.name)}</span><button class="rmbtn" onclick="clearUp()">×</button>`:`<span>📄 ${esc(f.name)}</span><button class="rmbtn" onclick="clearUp()">×</button>`;
}
function clearUp(){pendingFile=null;$('uprev').style.display='none';$('uprev').innerHTML='';$('fileinput').value=''}
document.addEventListener('dragover',e=>{e.preventDefault();$('dragov').classList.add('on')});
document.addEventListener('dragleave',e=>{if(!e.relatedTarget)$('dragov').classList.remove('on')});
document.addEventListener('drop',e=>{e.preventDefault();$('dragov').classList.remove('on');const f=e.dataTransfer.files[0];if(f)setFile(f)});

// ── LIGHTBOX ───────────────────────────────────────────
function openLB(url){$('limg').src=url;$('lbox').classList.add('on')}
function closeLB(){$('lbox').classList.remove('on')}

// ── PROFILES ───────────────────────────────────────────
function showProfile(uname){
  if(!uname)return;
  sock.emit('profile:get',uname,p=>{
    if(!p)return;
    const bg=aBg(p.username);const isMe=p.username===me.username;
    const m=document.createElement('div');m.className='movl';
    m.innerHTML=`<div class="modal">
      <button class="mclose" onclick="closeMod()">×</button>
      <div style="display:flex;align-items:center;gap:14px">
        <div class="mavatar" style="background:${bg};color:#0a0a0f">${ini(p.username)}</div>
        <div><div class="mmodname">${esc(p.username)}</div>
        <div style="font-size:12px;color:var(--mu);margin-top:2px">${onlineUsers.includes(p.username)?'🟢 Online':'⚫ Offline'}</div></div>
      </div>
      ${p.bio?`<div class="mbio">${esc(p.bio)}</div>`:''}
      <div class="mbtns">
        ${!isMe?`<button class="mbtn" onclick="closeMod();setPanel('dms');openDm('${esc(p.username)}')">Send DM</button>`:''}
        ${isMe?`<button class="mbtn pri" onclick="openEditP()">Edit profile</button>`:''}
        <button class="mbtn" onclick="closeMod()">Close</button>
      </div></div>`;
    m.onclick=e=>{if(e.target===m)closeMod()};
    $('mroot').innerHTML='';$('mroot').appendChild(m);
  });
}
function openEditP(){
  closeMod();
  const m=document.createElement('div');m.className='movl';
  m.innerHTML=`<div class="modal">
    <button class="mclose" onclick="closeMod()">×</button>
    <div style="font-size:16px;font-weight:600">Edit profile</div>
    <div class="mfield"><label>Bio</label><input id="ebio" type="text" value="${esc(me.bio||'')}" placeholder="Tell people about yourself…" maxlength="120"/></div>
    <div class="mbtns"><button class="mbtn pri" onclick="saveP()">Save</button><button class="mbtn" onclick="closeMod()">Cancel</button></div>
  </div>`;
  m.onclick=e=>{if(e.target===m)closeMod()};
  $('mroot').innerHTML='';$('mroot').appendChild(m);
}
async function saveP(){
  const bio=$('ebio').value.trim();
  await fetch('/api/profile',{method:'POST',headers:{'Content-Type':'application/json',Authorization:`Bearer ${token}`},body:JSON.stringify({bio})});
  me.bio=bio;localStorage.setItem('lc_me',JSON.stringify(me));closeMod();
}
function closeMod(){$('mroot').innerHTML=''}

// ── CREATE ROOM ─────────────────────────────────────────
function openCreateRoom(){
  const m=document.createElement('div');m.className='movl';
  m.innerHTML=`<div class="modal">
    <button class="mclose" onclick="closeMod()">×</button>
    <div style="font-size:16px;font-weight:600">Create a room</div>
    <div class="mfield"><label>Room name</label><input id="rnm" type="text" placeholder="e.g. design" maxlength="30"/></div>
    <div class="mfield"><label>Description</label><input id="rdsc" type="text" placeholder="What's this room about?" maxlength="80"/></div>
    <div class="mbtns"><button class="mbtn pri" onclick="createRoom()">Create</button><button class="mbtn" onclick="closeMod()">Cancel</button></div>
  </div>`;
  m.onclick=e=>{if(e.target===m)closeMod()};
  $('mroot').innerHTML='';$('mroot').appendChild(m);
  setTimeout(()=>$('rnm')?.focus(),50);
}
function createRoom(){
  const n=$('rnm').value.trim();if(!n)return;
  sock.emit('room:create',{name:n,description:$('rdsc').value.trim()});
  closeMod();setPanel('rooms');
}

// ── LOGOUT ─────────────────────────────────────────────
function logout(){localStorage.removeItem('lc_tok');localStorage.removeItem('lc_me');if(sock)sock.disconnect();location.reload()}

// ── START ──────────────────────────────────────────────
if(token&&me){boot()}
</script>
</body>
</html>
